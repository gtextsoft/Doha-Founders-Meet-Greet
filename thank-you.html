<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank you — Doha Founders Meet &amp; Greet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple-deep: #1a0822;
      --purple-mid: #2e0a3d;
      --gold: #e8d5b5;
      --white: #faf8fc;
      --muted: rgba(255, 255, 255, 0.82);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--purple-deep);
      color: var(--white);
      min-height: 100vh;
      line-height: 1.5;
    }
    .page-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 120% 80% at 100% 20%, rgba(138, 80, 180, 0.35), transparent 50%),
        radial-gradient(ellipse 80% 60% at 0% 100%, rgba(90, 40, 120, 0.4), transparent 45%),
        linear-gradient(180deg, var(--purple-deep) 0%, var(--purple-mid) 40%, #1f0a28 100%);
    }
    .page-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image:
        linear-gradient(30deg, transparent 40%, rgba(255, 255, 255, 0.03) 40%, rgba(255, 255, 255, 0.03) 45%, transparent 45%),
        linear-gradient(-25deg, transparent 48%, rgba(255, 255, 255, 0.02) 48%, rgba(255, 255, 255, 0.02) 52%, transparent 52%);
      background-size: 120px 100px, 100px 80px;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 2rem 1.25rem 3rem; text-align: center; }
    .logo-row { margin-bottom: 2.5rem; }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .logo svg { width: 22px; height: 22px; flex-shrink: 0; }
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .card h1 {
      font-family: "Outfit", sans-serif;
      font-weight: 800;
      font-size: clamp(1.5rem, 4vw, 2rem);
      letter-spacing: 0.04em;
      line-height: 1.2;
      color: var(--gold);
      text-transform: uppercase;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
      margin-bottom: 0.75rem;
    }
    .card .lead { font-size: 1rem; color: var(--muted); margin-bottom: 1.75rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.95rem 1.25rem;
      border-radius: 10px;
      font-family: "Outfit", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: linear-gradient(180deg, #25d366 0%, #128c7e 100%);
      color: #fff;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(37, 211, 102, 0.45); }
    .btn:active { transform: translateY(0); }
    .secondary { margin-top: 1.5rem; }
    .secondary a { color: var(--gold); font-size: 0.9rem; text-decoration: none; }
    .secondary a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="wrap">
    <header class="logo-row">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" opacity="0.8"/>
          <ellipse cx="12" cy="12" rx="4" ry="10" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
          <path d="M2 12h20" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
        </svg>
        <span>Stephen Akintayo Foundation</span>
      </div>
    </header>
    <main class="card">
      <h1>Thank you</h1>
      <p class="lead">Your registration was received. Check your email for confirmation and event details.</p>
      <a class="btn" href="https://chat.whatsapp.com/EKMUFtTPNbPIt9wQwn7X8q" target="_blank" rel="noopener noreferrer">Join the community</a>
      <p class="secondary"><a href="index.html">← Back to event page</a></p>
    </main>
  </div>
</body>
</html>
